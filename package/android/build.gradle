buildscript {
  ext.safeExtGet = { name, fallback ->
    rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['ReactNativeSlider_' + name] ?: fallback)
  }

  ext.kotlinVersion = safeExtGet('kotlinVersion', '2.2.0')

  repositories {
    mavenCentral()
    google()
  }

  dependencies {
    classpath("com.android.tools.build:gradle:8.6.0")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    // Bundled with Kotlin 2.x - this is what turns @Composable into Compose code.
    classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.facebook.react'

def getExtOrDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['ReactNativeSlider_' + name] ?: fallback)
}

def getExtOrIntegerDefault(name, fallback) {
  return getExtOrDefault(name, fallback).toString().toInteger()
}

android {
  namespace "callstack.slider"

  compileSdkVersion getExtOrIntegerDefault('compileSdkVersion', 35)
  buildToolsVersion getExtOrDefault('buildToolsVersion', '35.0.0')

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault('minSdkVersion', 24)
    targetSdkVersion getExtOrIntegerDefault('targetSdkVersion', 35)
  }

  buildFeatures {
    buildConfig true
    compose true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main {
      java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"]
    }
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  //noinspection GradleDynamicVersion
  api 'com.facebook.react:react-native:+'

  def composeBom = platform("androidx.compose:compose-bom:${getExtOrDefault('composeBomVersion', '2024.09.00')}")
  implementation composeBom
  implementation 'androidx.compose.runtime:runtime'
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.material3:material3'
}
